name: RetailPilot verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q retailpilot tests
      - run: python -m unittest discover -s tests -p 'test_pilot.py' -v

  cloud-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_cloud.mjs
      - run: node cloud/build.mjs
      - run: node --check cloud/dist/worker.mjs
